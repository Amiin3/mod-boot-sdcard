name: Mod SDcard Smart Auto

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      bootloader:
        description: "Pilih Bootloader / STB Target"
        required: true
        default: "hg680p"
        type: choice
        options:
          - hg680p
          - b860h
      fw_link:
        description: "Link Firmware (Support GDrive, Mega, Mediafire, Direct Link)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: SetUp Environment
      run: |
        PWD=$(pwd)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc > /dev/null 2>&1
        sudo -E apt-get -qq update > /dev/null 2>&1
        sudo -E apt-get -y install wget python3 p7zip-full unzip unrar tar gzip xz-utils > /dev/null 2>&1
        sudo -E apt-get -qq autoremove --purge > /dev/null 2>&1
        sudo -E apt-get -qq clean > /dev/null 2>&1
        sudo pip3 install gdown > /dev/null 2>&1
        sudo pip3 install git+https://github.com/Juvenal-Yescas/mediafire-dl > /dev/null 2>&1
        wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb && sudo apt install "$PWD/megacmd-xUbuntu_22.04_amd64.deb" > /dev/null 2>&1
        sudo mkdir -p openwrt > /dev/null 2>&1

    - name: Download Firmware
      run: |
        FW_LINK="${{ github.event.inputs.fw_link }}"
        cd openwrt
        echo "[SMART LOG] Mengunduh berkas dari: $FW_LINK"
        
        if echo "$FW_LINK" | grep -q "drive."; then
          if echo "$FW_LINK" | awk -F "/" '{print $6}' | grep -q "^[a-zA-Z0-9_-]*$"; then
            link_gdrive=$(echo "$FW_LINK" | awk -F "/" '{print $6}')
          else
            link_gdrive=$(echo "$FW_LINK" | awk -F "/" '{print $4}' | awk -F "?id=" '{print $2}' | awk -F "&export" '{print $1}')
          fi
          sudo gdown "${link_gdrive}"
        elif echo "$FW_LINK" | grep -q "mediafire.com"; then
          sudo mediafire-dl "$FW_LINK"
        elif echo "$FW_LINK" | grep -q "mega.nz"; then
          sudo mega-get "$FW_LINK"
        else
          sudo wget --content-disposition --show-progress --no-check-certificate "$FW_LINK"
        fi
        
        echo "[SMART LOG] Daftar berkas diunduh:"
        ls -lh

    - name: Smart Extract & Auto-Detect Firmware
      id: decompress
      run: |
        cd openwrt
        
        echo "[SMART LOG] Menjalankan sistem deteksi & ekstraksi pintar..."

        # Fungsi Ekstrak Otomatis Segala Jenis Arsip
        extract_archive() {
          local file="$1"
          case "$file" in
            *.7z|*.7Z)       sudo 7z x "$file" -y ;;
            *.zip|*.ZIP)     sudo unzip -o "$file" ;;
            *.rar|*.RAR)     sudo unrar x -y "$file" ;;
            *.tar.gz|*.tgz)  sudo tar -xzvf "$file" ;;
            *.gz|*.GZ)       sudo gunzip -f "$file" ;;
            *.xz|*.XZ)       sudo unxz -f "$file" ;;
          esac
        }

        # Loop ekstraksi jika berkas di dalam berupa arsip bersarang
        for i in {1..3}; do
          ARCHIVE=$(find . -maxdepth 2 -type f \( -iname "*.zip" -o -iname "*.rar" -o -iname "*.7z" -o -iname "*.tar.gz" \) | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "[SMART LOG] Mengekstrak arsip terdeteksi: $ARCHIVE"
            extract_archive "$ARCHIVE"
            sudo rm -f "$ARCHIVE"
          else
            break
          fi
        done

        # Analisis Cerdas: Cari file .img terbesar di seluruh direktori/subfolder
        TARGET_IMG=$(find . -type f -iname "*.img" -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

        if [ -z "$TARGET_IMG" ]; then
          echo "[ERROR] Sistem tidak menemukan file berkestensi .img di dalam paket ini!"
          ls -R
          exit 1
        fi

        echo "[SMART LOG] File Firmware Utama Terdeteksi: $TARGET_IMG"

        # Standarisasi Nama File untuk Mencegah Error Spasi/Karakter Khusus
        CLEAN_NAME="firmware.img"
        sudo mv "$TARGET_IMG" "./$CLEAN_NAME"

        # Simpan nama file ke environment
        echo "IMG_NAME=$CLEAN_NAME" >> $GITHUB_ENV
        echo "COMPRESSION=xz" >> $GITHUB_ENV
        echo "[SMART LOG] Berhasil menyiapakan firmware: $CLEAN_NAME"

    - name: Extract & Mod SDCard Firmware
      run: |
        sudo mkdir -p openwrt/boot
        sudo mv BootCardMaker/u-boot.bin openwrt/ 2>/dev/null || true
        sudo mv files/mod-boot-sdcard.tar.gz openwrt/ 2>/dev/null || true
        
        cd openwrt
        
        IMG="${{ env.IMG_NAME }}"
        echo "[SMART LOG] Memproses image: $IMG"

        # Pasang Loop Device secara aman
        device=$(sudo losetup -fP --show "$IMG")
        sudo partprobe ${device} 2>/dev/null || true
        sleep 2
        
        # Tentukan DTB berdasarkan pilihan Bootloader
        if [ "${{ github.event.inputs.bootloader }}" = "b860h" ]; then
          dtb="meson-gxl-s905x-b860h.dtb"
        else
          dtb="meson-gxl-s905x-p212.dtb"
        fi
        echo "[SMART LOG] Menggunakan Target DTB: $dtb"

        # Cek partisi boot (p1)
        if [ -b "${device}p1" ]; then
          sudo mount ${device}p1 boot
          
          # Ekstrak berkas mod jika ada
          if [ -f mod-boot-sdcard.tar.gz ]; then
            sudo tar -xzvf mod-boot-sdcard.tar.gz -C boot/ || true
          fi

          # OTOMATISASI ANALISIS OS & CONFIG PATCHING
          
          # 1. Deteksi Armbian / OpenWrt Kernel Image
          if [ -f boot/Image ] && [ -f boot/extlinux/extlinux.conf ]; then
            echo "[SMART LOG] Terdeteksi OS Armbian. Mengubah kernel path..."
            sudo sed -i 's|/zImage|/Image|g' boot/extlinux/extlinux.conf 2>/dev/null || true
          fi

          # 2. Patching OpenWrt UUID
          if [ -f boot/uEnv.txt ] && [ -f boot/extlinux/extlinux.conf ]; then
            uenv=$(sudo cat boot/uEnv.txt | grep APPEND | awk -F "root=" '{print $2}')
            extlinux=$(sudo cat boot/extlinux/extlinux.conf | grep append | awk -F "root=" '{print $2}')
            if [ -n "$uenv" ] && [ -n "$extlinux" ]; then
              sudo sed -i "s/$extlinux/$uenv/g" boot/extlinux/extlinux.conf
            fi
          fi

          # 3. Patching Semua File Konfigurasi Booting yang Ada secara Otomatis
          [ -f boot/boot.ini ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/boot.ini 2>/dev/null || true
          [ -f boot/extlinux/extlinux.conf ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/extlinux/extlinux.conf 2>/dev/null || true
          [ -f boot/uEnv.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/uEnv.txt 2>/dev/null || true
          [ -f boot/env.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/env.txt 2>/dev/null || true

          # 4. Patching ArmbianEnv
          if [ -f boot/armbianEnv.txt ]; then
            if grep -q "fdtfile" boot/armbianEnv.txt; then
              sudo sed -i -E "s|fdtfile=.*|fdtfile=amlogic/$dtb|g" boot/armbianEnv.txt
            else
              echo "fdtfile=amlogic/$dtb" | sudo tee -a boot/armbianEnv.txt
            fi
          fi

          # Unmount
          sudo umount -l boot 2>/dev/null || true
          sleep 1
        else
          echo "[SMART WARNING] Partisi 1 tidak ditemukan pada image ini."
        fi
        
        # Inject u-boot MBR untuk Bootcard / SDCard
        if [ -f u-boot.bin ]; then
          echo "[SMART LOG] Meng-inject u-boot.bin ke MBR..."
          sudo dd if=u-boot.bin of=${device} bs=1 count=444 conv=fsync 2>/dev/null
          sudo dd if=u-boot.bin of=${device} bs=512 skip=1 seek=1 conv=fsync 2>/dev/null
        fi

        sudo losetup -d ${device} 2>/dev/null || true
        sleep 1
        
        # Kompresi Otomatis Firmware Hasil Modifikasi
        echo "[SMART LOG] Mengkompresi ulang firmware hasil modifikasi..."
        sudo xz -z -4 "$IMG"

    - name: Find Firmware
      run: |
        FILE_PATH=$(find ./openwrt -type f \( -name "*.img.xz" -o -name "*.img.gz" -o -name "*.img" \))
        echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV
        echo "[SMART LOG] File siap dirilis: $FILE_PATH"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Firmware_Mod_SDCard_Smart
        tag_name: All
        draft: false
        prerelease: false
        files: |
          ${{ env.FILE_PATH }}
        body: |
          Build Otomatis Sistem Pintar (Support Android TV, Armbian & OpenWrt).
