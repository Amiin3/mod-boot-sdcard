name: Mod SDcard

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      bootloader:
        description: "Select Bootloader / STB"
        required: true
        default: "hg680p"
        type: choice
        options:
          - hg680p
          - b860h
      fw_link:
        description: "Insert Firmware Link (OpenWrt / Armbian / Android TV)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: SetUp environment
      run: |
        PWD=$(pwd)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc > /dev/null 2>&1
        sudo -E apt-get -qq update > /dev/null 2>&1
        sudo -E apt-get -y install wget python3 p7zip-full unzip unrar > /dev/null 2>&1
        sudo -E apt-get -qq autoremove --purge > /dev/null 2>&1
        sudo -E apt-get -qq clean > /dev/null 2>&1
        sudo pip3 install gdown > /dev/null 2>&1
        sudo pip3 install git+https://github.com/Juvenal-Yescas/mediafire-dl > /dev/null 2>&1
        wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb && sudo apt install "$PWD/megacmd-xUbuntu_22.04_amd64.deb" > /dev/null 2>&1
        sudo mkdir -p openwrt > /dev/null 2>&1

    - name: Download Firmware
      run: |
        FW_LINK="${{ github.event.inputs.fw_link }}"
        cd openwrt
        echo "Mengunduh dari: $FW_LINK"
        
        if echo "$FW_LINK" | grep -q "drive."; then
          if echo "$FW_LINK" | awk -F "/" '{print $6}' | grep -q "^[a-zA-Z0-9_-]*$"; then
            link_gdrive=$(echo "$FW_LINK" | awk -F "/" '{print $6}')
          else
            link_gdrive=$(echo "$FW_LINK" | awk -F "/" '{print $4}' | awk -F "?id=" '{print $2}' | awk -F "&export" '{print $1}')
          fi
          sudo gdown "${link_gdrive}"
        elif echo "$FW_LINK" | grep -q "mediafire.com"; then
          sudo mediafire-dl "$FW_LINK"
        elif echo "$FW_LINK" | grep -q "mega.nz"; then
          sudo mega-get "$FW_LINK"
        else
          sudo wget --content-disposition --show-progress --no-check-certificate "$FW_LINK"
        fi
        
        echo "--- Cek file yang berhasil diunduh ---"
        ls -lh

    - name: Decompress Firmware
      id: decompress
      run: |
        cd openwrt
        
        # 1. Cari file arsip utama
        RAW_FILE=$(find . -maxdepth 1 -type f \( -iname "*.img*" -o -iname "*.7z" -o -iname "*.zip" -o -iname "*.rar" \) | head -n 1)
        
        if [ -z "$RAW_FILE" ]; then
          echo "Error: File firmware tidak ditemukan di folder openwrt!"
          ls -la
          exit 1
        fi

        echo "Mendeteksi file: $RAW_FILE"
        
        # 2. Ekstrak arsip jika berbentuk kompresi
        if [[ "$RAW_FILE" =~ \.(7z|7Z)$ ]]; then
          sudo 7z x "$RAW_FILE" -y
          sudo rm -f "$RAW_FILE"
        elif [[ "$RAW_FILE" =~ \.(zip|ZIP)$ ]]; then
          sudo unzip -o "$RAW_FILE"
          sudo rm -f "$RAW_FILE"
        elif [[ "$RAW_FILE" =~ \.(rar|RAR)$ ]]; then
          sudo unrar x -y "$RAW_FILE"
          sudo rm -f "$RAW_FILE"
        fi

        # 3. Cari file berkestensi .img di seluruh subfolder (pilih file ukuran terbesar)
        TARGET_IMG=$(find . -type f -iname "*.img" -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

        if [ -z "$TARGET_IMG" ]; then
          echo "Error: File .img tidak ditemukan setelah ekstraksi!"
          echo "--- Isi folder saat ini: ---"
          find . -type f
          exit 1
        fi

        echo "File IMG ditemukan: $TARGET_IMG"

        # 4. Amankan nama file menjadi 'firmware.img' tanpa spasi
        CLEAN_NAME="firmware.img"
        sudo mv "$TARGET_IMG" "./$CLEAN_NAME"

        # 5. Set Environment Variable secara wajib
        echo "IMG_NAME=$CLEAN_NAME" >> $GITHUB_ENV
        echo "COMPRESSION=xz" >> $GITHUB_ENV
        echo "Sukses menyetel IMG_NAME=$CLEAN_NAME"

    - name: Extract & Mod SDCard Firmware
      run: |
        # Validasi awal sebelum memproses
        if [ -z "${{ env.IMG_NAME }}" ]; then
          echo "Error: Variable IMG_NAME kosong! Proses dihentikan."
          exit 1
        fi

        sudo mkdir -p openwrt/boot
        sudo mv BootCardMaker/u-boot.bin openwrt/ 2>/dev/null || true
        sudo mv files/mod-boot-sdcard.tar.gz openwrt/ 2>/dev/null || true
        
        cd openwrt
        
        IMG="${{ env.IMG_NAME }}"
        echo "Memproses file image: $IMG"
        
        # Setup Loop Device
        device=$(sudo losetup -fP --show "$IMG")
        sudo partprobe ${device} 2>/dev/null || true
        sleep 2
        
        # Tentukan DTB berdasarkan pilihan Bootloader
        if [ "${{ github.event.inputs.bootloader }}" = "b860h" ]; then
          dtb="meson-gxl-s905x-b860h.dtb"
        else
          dtb="meson-gxl-s905x-p212.dtb"
        fi

        # Cek ketersediaan partisi 1
        if [ -b "${device}p1" ]; then
          sudo mount ${device}p1 boot
          
          # Ekstrak berkas mod jika ada
          if [ -f mod-boot-sdcard.tar.gz ]; then
            sudo tar -xzvf mod-boot-sdcard.tar.gz -C boot/ || true
          fi

          # Adjust Kernel Armbian
          if [ -f boot/Image ] && [ -f boot/extlinux/extlinux.conf ]; then
            sudo sed -i 's|/zImage|/Image|g' boot/extlinux/extlinux.conf 2>/dev/null || true
          fi

          # Update DTB di berbagai konfigurasi boot
          [ -f boot/boot.ini ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/boot.ini 2>/dev/null || true
          [ -f boot/extlinux/extlinux.conf ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/extlinux/extlinux.conf 2>/dev/null || true
          [ -f boot/uEnv.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/uEnv.txt 2>/dev/null || true
          [ -f boot/env.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/env.txt 2>/dev/null || true

          if [ -f boot/armbianEnv.txt ]; then
            if grep -q "fdtfile" boot/armbianEnv.txt; then
              sudo sed -i -E "s|fdtfile=.*|fdtfile=amlogic/$dtb|g" boot/armbianEnv.txt
            else
              echo "fdtfile=amlogic/$dtb" | sudo tee -a boot/armbianEnv.txt
            fi
          fi

          # Unmount
          sudo umount -l boot 2>/dev/null || true
          sleep 1
        else
          echo "Peringatan: Partisi ${device}p1 tidak ditemukan."
        fi
        
        # Inject u-boot ke MBR/Bootcard area untuk SDCard Boot
        if [ -f u-boot.bin ]; then
          sudo dd if=u-boot.bin of=${device} bs=1 count=444 conv=fsync 2>/dev/null
          sudo dd if=u-boot.bin of=${device} bs=512 skip=1 seek=1 conv=fsync 2>/dev/null
        fi

        sudo losetup -d ${device} 2>/dev/null || true
        sleep 1
        
        # Kompres kembali firmware
        sudo xz -z -4 "$IMG"

    - name: Find Firmware
      run: |
        FILE_PATH=$(find ./openwrt -type f \( -name "*.img.xz" -o -name "*.img.gz" -o -name "*.img" \))
        echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV
        echo "FILE_PATH path: $FILE_PATH"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Firmware_Mod_SDCard
        tag_name: All
        draft: false
        prerelease: false
        files: |
          ${{ env.FILE_PATH }}
        body: |
          Mod SDCard Firmware (Support Android TV, Armbian & OpenWrt)
