- name: Decompress Firmware
      id: decompress
      run: |
        cd openwrt
        RAW_FILE=$(find . -maxdepth 1 -type f \( -name "*.img*" -o -name "*.7z" -o -name "*.zip" -o -name "*.rar" \) | head -n 1)
        
        if [ -z "$RAW_FILE" ]; then
          echo "Error: File firmware tidak ditemukan!"
          exit 1
        fi

        echo "Mendeteksi file: $RAW_FILE"
        
        # Ekstrak jika formatnya arsip
        if [[ "$RAW_FILE" == *.7z ]]; then
          sudo 7z x "$RAW_FILE"
          sudo rm -f "$RAW_FILE"
        elif [[ "$RAW_FILE" == *.zip ]]; then
          sudo unzip "$RAW_FILE"
          sudo rm -f "$RAW_FILE"
        elif [[ "$RAW_FILE" == *.rar ]]; then
          sudo unrar x -y "$RAW_FILE"
          sudo rm -f "$RAW_FILE"
        fi

        # Cari file .img di dalam sub-folder dan pindahkan ke direktori utama
        DEEP_IMG=$(find . -type f -name "*.img" | head -n 1)
        if [ -n "$DEEP_IMG" ] && [ "$DEEP_IMG" != "./$(basename "$DEEP_IMG")" ]; then
          echo "Memindahkan $DEEP_IMG ke direktori utama..."
          sudo mv "$DEEP_IMG" ./
        fi

        # Proses file hasil ekstraksi
        NEW_RAW=$(find . -maxdepth 1 -type f \( -name "*.img" -o -name "*.img.gz" -o -name "*.img.xz" \) | head -n 1)
        
        if [[ "$NEW_RAW" == *.img.gz ]]; then
          sudo gunzip -f "$NEW_RAW"
          IMG_FILE="${NEW_RAW%.gz}"
          COMPRESSION="gz"
        elif [[ "$NEW_RAW" == *.img.xz ]]; then
          sudo unxz -f "$NEW_RAW"
          IMG_FILE="${NEW_RAW%.xz}"
          COMPRESSION="xz"
        elif [[ "$NEW_RAW" == *.img ]]; then
          IMG_FILE="$NEW_RAW"
          COMPRESSION="xz"
        else
          echo "Error: Tidak ada file .img yang ditemukan setelah ekstrak!"
          exit 1
        fi

        IMG_NAME=$(basename "$IMG_FILE")
        echo "IMG_NAME=$IMG_NAME" >> $GITHUB_ENV
        echo "COMPRESSION=$COMPRESSION" >> $GITHUB_ENV
