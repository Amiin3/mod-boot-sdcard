name: Mod SDcard Full Fitur

on:
  repository_dispatch:
  workflow_dispatch:
    inputs:
      bootloader:
        description: "Pilih Bootloader / STB Target"
        required: true
        default: "hg680p"
        type: choice
        options:
          - hg680p
          - b860h
      fw_link:
        description: "Link Firmware (GDrive / Mediafire / Mega / Direct Link)"
        required: true
        default: ""

permissions:
  contents: write

jobs:
  setup:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: SetUp Environment
      run: |
        PWD=$(pwd)
        sudo rm -rf /etc/apt/sources.list.d/* /usr/share/dotnet /usr/local/lib/android /opt/ghc > /dev/null 2>&1
        sudo -E apt-get -qq update > /dev/null 2>&1
        sudo -E apt-get -y install wget python3 p7zip-full unzip unrar tar gzip xz-utils kpartx file > /dev/null 2>&1
        sudo -E apt-get -qq autoremove --purge > /dev/null 2>&1
        sudo -E apt-get -qq clean > /dev/null 2>&1
        sudo pip3 install --upgrade pip > /dev/null 2>&1
        sudo pip3 install gdown > /dev/null 2>&1
        sudo pip3 install git+https://github.com/Juvenal-Yescas/mediafire-dl > /dev/null 2>&1
        wget https://mega.nz/linux/repo/xUbuntu_22.04/amd64/megacmd-xUbuntu_22.04_amd64.deb && sudo apt install "$PWD/megacmd-xUbuntu_22.04_amd64.deb" > /dev/null 2>&1
        sudo mkdir -p openwrt > /dev/null 2>&1

    - name: Download Firmware
      run: |
        FW_LINK="${{ github.event.inputs.fw_link }}"
        cd openwrt
        echo "[LOG] Mengunduh firmware dari: $FW_LINK"
        
        # Ekstrak File ID Google Drive jika ada
        GDRIVE_ID=$(echo "$FW_LINK" | grep -oP '(?<=/d/|id=)[a-zA-Z0-9_-]{25,}' | head -n 1)

        if echo "$FW_LINK" | grep -E -q "drive.google.com|drive.usercontent.google.com|docs.google.com" || [ -n "$GDRIVE_ID" ]; then
          echo "[LOG] Terdeteksi link Google Drive..."
          
          if [ -n "$GDRIVE_ID" ]; then
            echo "[LOG] Mengunduh via Google Drive File ID: $GDRIVE_ID"
            sudo gdown --id "$GDRIVE_ID" || true
          fi
          
          if [ $(find . -type f | wc -l) -eq 0 ]; then
            echo "[LOG] Mengunduh via gdown --fuzzy..."
            sudo gdown --fuzzy "$FW_LINK" || true
          fi

          if [ $(find . -type f | wc -l) -eq 0 ]; then
            echo "[LOG] Fallback ke wget..."
            sudo wget --content-disposition --show-progress --no-check-certificate "$FW_LINK" || true
          fi
        elif echo "$FW_LINK" | grep -q "mediafire.com"; then
          echo "[LOG] Terdeteksi link Mediafire..."
          sudo mediafire-dl "$FW_LINK"
        elif echo "$FW_LINK" | grep -q "mega.nz"; then
          echo "[LOG] Terdeteksi link Mega.nz..."
          sudo mega-get "$FW_LINK"
        else
          echo "[LOG] Terdeteksi Direct Link / URL Biasa..."
          sudo wget --content-disposition --show-progress --no-check-certificate "$FW_LINK"
        fi
        
        echo "[LOG] Daftar berkas yang berhasil diunduh:"
        ls -lh

        if [ $(find . -type f | wc -l) -eq 0 ]; then
          echo "[ERROR] Gagal mengunduh file dari link yang diberikan!"
          exit 1
        fi

    - name: Decompress & Detect Firmware
      id: decompress
      run: |
        cd openwrt
        
        echo "[LOG] Memulai proses dekompresi bertingkat..."

        # Loop ekstraksi bertingkat universal tanpa batas kedalaman folder
        for i in {1..5}; do
          ARCHIVE=$(find . -type f \( -iname "*.xz" -o -iname "*.gz" -o -iname "*.zip" -o -iname "*.rar" -o -iname "*.7z" -o -iname "*.tar*" -o -iname "*.tgz" -o -iname "*.bz2" -o -iname "*.zst" \) | head -n 1)
          if [ -n "$ARCHIVE" ]; then
            echo "[LOG] Mengekstrak arsip terdeteksi: $ARCHIVE"
            sudo 7z x "$ARCHIVE" -y > /dev/null 2>&1 || true
            sudo rm -f "$ARCHIVE" 2>/dev/null || true
          else
            break
          fi
        done

        echo "[LOG] Memulai pendeteksian berkas firmware..."

        # Prioritas 1: Cari ekstensi umum (.img, .bin, .raw)
        TARGET_FILE=$(find . -type f \( -iname "*.img" -o -iname "*.bin" -o -iname "*.raw" \) -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)

        # Prioritas 2 (Fallback Pintar): Ambil file terbesar (>50MB) apapun ekstensinya (misal .A.Sop atau tanpa ekstensi)
        if [ -z "$TARGET_FILE" ]; then
          echo "[LOG] Ekstensi standar tidak ditemukan. Memindai file terbesar (>50MB)..."
          TARGET_FILE=$(find . -type f -size +50M -printf "%s %p\n" | sort -nr | head -n 1 | cut -d' ' -f2-)
        fi

        if [ -z "$TARGET_FILE" ]; then
          echo "[ERROR] File firmware tidak ditemukan setelah dekompresi!"
          echo "--- Isi direktori saat ini: ---"
          find . -type f
          exit 1
        fi

        echo "[LOG] File Firmware utama ditemukan: $TARGET_FILE"

        # Sanitisasi nama file ke firmware.img untuk menghindari masalah spasi/karakter khusus
        CLEAN_NAME="firmware.img"
        sudo mv "$TARGET_FILE" "./$CLEAN_NAME"

        # Simpan nama file ke environment variable
        echo "IMG_NAME=$CLEAN_NAME" >> $GITHUB_ENV
        echo "COMPRESSION=xz" >> $GITHUB_ENV
        echo "[LOG] Berhasil diset: IMG_NAME=$CLEAN_NAME"

    - name: Extract & Mod SDCard Firmware
      run: |
        if [ -z "${{ env.IMG_NAME }}" ]; then
          echo "[ERROR] Variable env.IMG_NAME kosong! Proses dihentikan."
          exit 1
        fi

        sudo mkdir -p openwrt/boot
        sudo mv BootCardMaker/u-boot.bin openwrt/ 2>/dev/null || true
        sudo mv files/mod-boot-sdcard.tar.gz openwrt/ 2>/dev/null || true
        
        cd openwrt
        
        IMG="${{ env.IMG_NAME }}"
        echo "[LOG] Memproses file image: $IMG"
        
        # Mount Loop Device
        device=$(sudo losetup -fP --show "$IMG")
        sudo partprobe ${device} 2>/dev/null || true
        sleep 2
        
        # Tentukan DTB berdasarkan Bootloader Target
        if [ "${{ github.event.inputs.bootloader }}" = "b860h" ]; then
          dtb="meson-gxl-s905x-b860h.dtb"
        else
          dtb="meson-gxl-s905x-p212.dtb"
        fi
        echo "[LOG] DTB Target: $dtb"

        # Cek partisi boot (p1)
        BOOT_PART="${device}p1"
        if [ ! -b "$BOOT_PART" ]; then
          # Fallback menggunakan kpartx jika partprobe gagal membuat simlink partisi
          sudo kpartx -av "$device" 2>/dev/null || true
          loop_name=$(echo "$device" | cut -d'/' -f3)
          BOOT_PART="/dev/mapper/${loop_name}p1"
        fi

        if [ -b "$BOOT_PART" ]; then
          echo "[LOG] Mounting partisi boot: $BOOT_PART"
          sudo mount "$BOOT_PART" boot
          
          # Ekstrak berkas modifikasi jika ada
          if [ -f mod-boot-sdcard.tar.gz ]; then
            sudo tar -xzvf mod-boot-sdcard.tar.gz -C boot/ || true
          fi

          # 1. Sesuaikan Kernel Armbian
          if [ -f boot/Image ] && [ -f boot/extlinux/extlinux.conf ]; then
            echo "[LOG] Terdeteksi Kernel Armbian (/Image)"
            sudo sed -i 's|/zImage|/Image|g' boot/extlinux/extlinux.conf 2>/dev/null || true
          fi

          # 2. Patch UUID OpenWrt
          if [ -f boot/uEnv.txt ] && [ -f boot/extlinux/extlinux.conf ]; then
            uenv=$(sudo cat boot/uEnv.txt | grep APPEND | awk -F "root=" '{print $2}')
            extlinux=$(sudo cat boot/extlinux/extlinux.conf | grep append | awk -F "root=" '{print $2}')
            if [ -n "$uenv" ] && [ -n "$extlinux" ]; then
              sudo sed -i "s/$extlinux/$uenv/g" boot/extlinux/extlinux.conf
            fi
          fi

          # 3. Patch DTB Otomatis ke Semua Jenis Config
          [ -f boot/boot.ini ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/boot.ini 2>/dev/null || true
          [ -f boot/extlinux/extlinux.conf ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/extlinux/extlinux.conf 2>/dev/null || true
          [ -f boot/uEnv.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/uEnv.txt 2>/dev/null || true
          [ -f boot/env.txt ] && sudo sed -i -E "s/meson-.*\.dtb/$dtb/g" boot/env.txt 2>/dev/null || true

          if [ -f boot/armbianEnv.txt ]; then
            if grep -q "fdtfile" boot/armbianEnv.txt; then
              sudo sed -i -E "s|fdtfile=.*|fdtfile=amlogic/$dtb|g" boot/armbianEnv.txt
            else
              echo "fdtfile=amlogic/$dtb" | sudo tee -a boot/armbianEnv.txt
            fi
          fi

          # Unmount
          sudo umount -l boot 2>/dev/null || true
          sleep 1
        else
          echo "[WARNING] Partisi boot tidak terdeteksi pada image ini."
        fi
        
        # Inject u-boot MBR untuk Bootcard/SDCard
        if [ -f u-boot.bin ]; then
          echo "[LOG] Inject u-boot.bin ke MBR..."
          sudo dd if=u-boot.bin of=${device} bs=1 count=444 conv=fsync 2>/dev/null
          sudo dd if=u-boot.bin of=${device} bs=512 skip=1 seek=1 conv=fsync 2>/dev/null
        fi

        sudo kpartx -dv ${device} 2>/dev/null || true
        sudo losetup -d ${device} 2>/dev/null || true
        sleep 1
        
        # Kompresi Ulang Firmware
        echo "[LOG] Mengkompresi ulang hasil firmware (xz)..."
        sudo xz -z -4 "$IMG"

    - name: Find Firmware
      run: |
        FILE_PATH=$(find ./openwrt -type f \( -name "*.img.xz" -o -name "*.img.gz" -o -name "*.img" \))
        echo "FILE_PATH=$FILE_PATH" >> $GITHUB_ENV
        echo "[LOG] File output: $FILE_PATH"

    - name: Create Release
      uses: softprops/action-gh-release@v2
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      with:
        name: Firmware_Mod_SDCard_Full
        tag_name: All
        draft: false
        prerelease: false
        files: |
          ${{ env.FILE_PATH }}
        body: |
          Build Otomatis SDCard Firmware Mod (Support OpenWrt, Armbian & Android TV).
